<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Duelos — El Octágono</title>
<link rel="icon" href="img/logos/isotype.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div>
        <a class="brand" href="admin.html"><img class="brand-icon" src="img/logos/isotype.svg" alt="El Octágono" />EL <span class="brand-arena">OCTÁGONO</span></a>
        <div class="subtitle">Duelos · 1 vs 1</div>
      </div>
      <div style="display:flex; align-items:center; gap: 10px;">
        <button id="logout-btn" class="btn btn-ghost btn-sm" hidden>Cerrar sesión</button>
        <a class="back-link" href="admin.html">← Inicio</a>
      </div>
    </div>

    <section id="login-gate" class="glass-card" style="max-width: 420px; margin: 80px auto; text-align: center;">
      <div class="icon" style="font-size: 2rem; margin-bottom: 10px;"><i class="fa-solid fa-lock"></i></div>
      <h2 class="section-title">Acceso restringido</h2>
      <p class="section-sub">Inicia sesión con tu cuenta de GitHub para continuar.</p>
      <button id="login-btn" class="btn btn-primary btn-block">Iniciar sesión con GitHub</button>
      <p id="uid-hint" class="section-sub" hidden style="margin-top: 16px; font-size: 0.78rem; word-break: break-all;"></p>
    </section>

    <div id="protected-content" hidden>
    <!-- Setup -->
    <section id="setup-section" class="glass-card">
      <h2 class="section-title">Arma el duelo</h2>
      <p class="section-sub">1 vs 1. Ingresa a los 2 jugadores, elige el formato de la serie y listo.</p>
      <div class="player-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 4px;">
        <div class="field">
          <label>Formato de la serie</label>
          <select id="best-of">
            <option value="3" selected>Mejor de 3</option>
            <option value="5">Mejor de 5</option>
          </select>
        </div>
        <div class="field">
          <label>Costo de inscripción</label>
          <select id="entry-fee">
            <option value="Gratuito" selected>Gratuito</option>
            <option value="$1 USD">$1 USD</option>
            <option value="$2 USD">$2 USD</option>
            <option value="$5 USD">$5 USD</option>
          </select>
        </div>
      </div>
      <form id="setup-form">
        <div id="player-inputs"></div>
        <div class="actions-row">
          <button type="submit" class="btn btn-primary">Crear duelo</button>
        </div>
      </form>
    </section>

    <!-- Series -->
    <section id="series-section" hidden>
      <div id="champion-banner"></div>

      <div class="glass-card" style="margin-bottom: 20px;">
        <h2 class="section-title">Jugadores</h2>
        <p class="section-sub">Los nombres son editables.</p>
        <div class="bento-grid two-col" id="teams-list"></div>
      </div>

      <div class="glass-card">
        <h2 class="section-title">Marcador de la serie</h2>
        <p class="section-sub" id="series-format-label"></p>
        <div class="neo-surface series-score" id="series-score"></div>
        <div id="game-actions" class="actions-row" style="justify-content:center;"></div>
        <div class="game-log" id="game-log"></div>
      </div>

      <div class="actions-row">
        <a href="duelos-view.html" target="_blank" class="btn btn-ghost"><i class="fa-solid fa-link"></i> Ver vista pública</a>
        <button id="finalize-btn" class="btn btn-primary"><i class="fa-solid fa-circle-check"></i> Finalizar torneo</button>
        <button id="reset-btn" class="btn btn-danger">Nuevo torneo</button>
      </div>
    </section>
    </div>

    <footer class="credits">© <span id="copyright-year"></span> El Octágono</footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/auth-gate.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/duelos.js"></script>
  <script src="js/copyright.js"></script>
</body>
</html>
