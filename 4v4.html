<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modo Equipos — CS HUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9876;&#65039;</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div>
        <a class="brand" href="index.html"><span class="dot"></span>CS HUB</a>
        <div class="subtitle">Modo Equipos · 2 equipos, tamaño configurable</div>
      </div>
      <a class="back-link" href="index.html">← Inicio</a>
    </div>

    <!-- Setup -->
    <section id="setup-section" class="glass-card">
      <h2 class="section-title">Arma la serie</h2>
      <p class="section-sub">Elige el tamaño de equipo, ingresa a los jugadores y el formato. Los equipos se sortean automáticamente.</p>
      <div class="player-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 4px;">
        <div class="field">
          <label>Tamaño de equipo</label>
          <select id="team-size">
            <option value="3">3 vs 3</option>
            <option value="4" selected>4 vs 4</option>
            <option value="5">5 vs 5</option>
          </select>
        </div>
        <div class="field">
          <label>Formato de la serie</label>
          <select id="best-of">
            <option value="1">Mejor de 1</option>
            <option value="3" selected>Mejor de 3</option>
            <option value="5">Mejor de 5</option>
            <option value="7">Mejor de 7</option>
          </select>
        </div>
      </div>
      <form id="setup-form">
        <div class="player-grid" id="player-inputs"></div>
        <div class="actions-row">
          <button type="submit" class="btn btn-primary">Sortear equipos y empezar</button>
        </div>
      </form>
    </section>

    <!-- Series -->
    <section id="series-section" hidden>
      <div id="champion-banner"></div>

      <div class="glass-card" style="margin-bottom: 20px;">
        <h2 class="section-title">Equipos</h2>
        <p class="section-sub">Los nombres son editables.</p>
        <div class="bento-grid two-col" id="teams-list"></div>
      </div>

      <div class="glass-card">
        <h2 class="section-title">Marcador de la serie</h2>
        <p class="section-sub" id="series-format-label"></p>
        <div class="neo-surface series-score" id="series-score"></div>
        <div id="game-actions" class="actions-row" style="justify-content:center;"></div>
        <div class="game-log" id="game-log"></div>
      </div>

      <div class="actions-row">
        <button id="reset-btn" class="btn btn-danger">Nuevo torneo</button>
      </div>
    </section>

    <footer class="credits">CS HUB · Modo Equipos</footer>
  </div>

  <script src="js/teams.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/fourvfour.js"></script>
</body>
</html>
