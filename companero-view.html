<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modo Compañero (en vivo) — Counter Arena</title>
<link rel="icon" href="img/isotype.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="readonly">
  <div class="page">
    <div class="top-bar">
      <div>
        <a class="brand" href="index.html"><img class="brand-icon" src="img/isotype.svg" alt="Counter Arena" />COUNTER <span class="brand-arena">ARENA</span></a>
        <div class="subtitle">Modo Compañero · vista pública</div>
      </div>
      <span class="live-badge"><span class="blip"></span>EN VIVO</span>
    </div>

    <div id="empty-state" class="glass-card empty-hint">Esperando a que se cree un torneo…</div>

    <section id="result-section" hidden>
      <div id="champion-banner"></div>

      <div class="glass-card" style="margin-bottom: 20px;">
        <h2 class="section-title">Equipos</h2>
        <div class="bento-grid" id="teams-list"></div>
      </div>

      <div class="glass-card">
        <h2 class="section-title" id="matches-title">Llaves</h2>
        <p class="section-sub" id="matches-sub"></p>
        <div id="matches-view"></div>
      </div>
    </section>

    <footer class="credits">© <span id="copyright-year"></span> Counter Arena · Modo Compañero (solo lectura)</footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/companero-view.js"></script>
  <script src="js/copyright.js"></script>
</body>
</html>
